<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مسابقة الأمان السيبرني – قبلي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#eef3fa; --surface:#ffffff; --fg:#14213d; --muted:#5a6785;
  --red:#c8102e; --blue:#1d4ed8; --line:#d5deeb;
  --ok:#157f4a; --ok-bg:#e3f5ea; --bad:#b3261e; --bad-bg:#fbe7e5;
  --display:"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1526; --surface:#16213a; --fg:#e8eefb; --muted:#9aa8c7;
  --red:#e3354f; --blue:#6b9bff; --line:#2a3757;
  --ok:#5fd394; --ok-bg:#123524; --bad:#ff8a80; --bad-bg:#3a1a1c; color-scheme:dark}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7}
img,canvas{max-width:100%}
[hidden]{display:none!important}
.band{background:var(--red);color:#fff}
.band .in,.wrap{max-width:680px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.band .in{padding-block:28px 34px}
.band small{display:block;font-size:.85rem;opacity:.9}
.band h1{font-family:var(--display);font-size:clamp(1.5rem,5vw,2.1rem);line-height:1.35;margin:.3rem 0 .4rem;text-wrap:balance}
.band .meta{display:flex;flex-wrap:wrap;gap:8px;font-size:.85rem}
.band .meta span{background:rgba(255,255,255,.18);padding:2px 10px;border-radius:99px}
.wrap{padding-block:24px 40px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;margin-top:-30px;box-shadow:0 6px 24px rgba(20,33,61,.08)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:.9rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:99px;margin:10px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .3s}
h2{font-family:var(--display);font-size:1.3rem;line-height:1.5;margin:0 0 16px;text-wrap:balance}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:right;background:var(--bg);color:var(--fg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:focus-visible,.btn:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.fb{margin-top:16px;padding:14px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.fb b{display:block;margin-bottom:2px}
.fb.ok b{color:var(--ok)} .fb.no b{color:var(--bad)}
.actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-start;margin-top:18px}
.btn{font:inherit;font-weight:600;background:var(--blue);color:#fff;border:0;border-radius:10px;padding:10px 22px;cursor:pointer}
.btn.alt{background:transparent;color:var(--blue);border:1.5px solid var(--blue)}
.score{font-family:var(--display);font-size:3rem;color:var(--blue);margin:6px 0;font-variant-numeric:tabular-nums}
.tips{margin:14px 0 0;padding-right:20px}
.thanks{font-family:var(--display);font-size:1.6rem;color:var(--red);margin:22px 0 4px;line-height:1.4}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
.form input{font:inherit;padding:11px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.note{font-size:.85rem;color:var(--muted);margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1px dashed var(--line)}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.badge-wrap{text-align:center;margin-top:18px}
.badge-wrap canvas{width:100%;max-width:340px;height:auto;border-radius:20px;box-shadow:0 10px 30px rgba(20,33,61,.25)}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:22px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>

<header class="band"><div class="in">
  <small>الحملة الوطنية التحسيسية لحماية الأسرة والطفل في الفضاء السيبرني 2027</small>
  <h1>مسابقة: هل أنت آمن على الإنترنت؟</h1>
  <div class="meta"><span>المندوبية الجهوية للتربية بقبلي</span><span>19 – 23 أكتوبر 2026</span></div>
</div></header>

<main class="wrap">
  <section class="card" id="app" aria-live="polite"></section>
  <footer>أجب عن 10 أسئلة واكتشف نتيجتك في النهاية</footer>
</main>

<script>
const Q=[
["أيّ كلمة من كلمات العبور التالية هي الأقوى؟",["123456","تاريخ ميلادي","Ahmed2010","Nakhla!Douz#27sahra"],3,"كلمة العبور القوية طويلة وتجمع بين حروف كبيرة وصغيرة وأرقام ورموز، ولا تحتوي على معلومات شخصية يسهل تخمينها."],
["وصلتك رسالة: «ربحت هاتفاً مجانياً! اضغط على الرابط وأدخل كلمة عبور حسابك». ماذا تفعل؟",["أضغط على الرابط بسرعة قبل انتهاء العرض","لا أضغط على الرابط، وأحذف الرسالة وأُعلم وليّي","أرسل الرابط لأصدقائي ليربحوا أيضاً","أُدخل كلمة العبور فقط دون معلومات أخرى"],1,"هذه رسالة تصيّد احتيالي. لا توجد جهة موثوقة تطلب كلمة عبورك عبر رابط، والعروض المغرية جداً غالباً فخّ لسرقة الحسابات."],
["شخص تعرّفت عليه عبر الإنترنت يطلب منك صوراً خاصة أو لقاءً سرّياً دون علم والديك. ما التصرّف الصحيح؟",["أوافق لأنه يبدو لطيفاً","أحتفظ بالأمر سراً كما طلب","أرفض، أحظره، وأُخبر شخصاً بالغاً أثق به فوراً","أرسل صورة واحدة فقط"],2,"طلب السرّية أو الصور الخاصة علامة خطر واضحة. الرفض والحظر وإخبار الوالدين أو المعلّم هو التصرّف الآمن، مع التبليغ عن الحساب."],
["ما المقصود بالتحقّق بخطوتين؟",["كتابة كلمة العبور مرّتين","إضافة خطوة ثانية للدخول كرمز يصل إلى هاتفك بعد كلمة العبور","امتلاك حسابين على نفس التطبيق","تغيير كلمة العبور كل يومين"],1,"التحقّق بخطوتين يحمي حسابك حتى لو سُرقت كلمة العبور، لأن المهاجم يحتاج أيضاً إلى الرمز الذي يصل إلى جهازك."],
["أيّ من هذه المعلومات يجب ألّا تنشرها علناً على شبكات التواصل؟",["لوني المفضّل","عنوان منزلي واسم مدرستي ورقم هاتفي","رأيي في فيلم شاهدته","صورة لمنظر طبيعي"],1,"العنوان والمدرسة ورقم الهاتف معلومات حسّاسة قد تسمح لغرباء بتحديد مكانك أو انتحال هويتك."],
["زميلك يتعرّض للسخرية والتهديد المتكرّر في مجموعة دردشة. ماذا تفعل؟",["أشارك في التعليقات حتى لا أُستهدف","أتجاهل الأمر، فهو لا يعنيني","أساند زميلي، أحتفظ بلقطات شاشة، وأُبلغ شخصاً بالغاً أو أستاذاً","أردّ بالشتم على المتنمّرين"],2,"هذا تنمّر إلكتروني. مساندة الضحية وحفظ الأدلة وإبلاغ الكبار يساعد على إيقافه، والردّ بالشتم يزيد الوضع سوءاً."],
["لماذا من المهمّ تحديث الهاتف والتطبيقات بانتظام؟",["لتغيير ألوان الشاشة فقط","لأن التحديثات تسدّ ثغرات أمنية يستغلّها المخترقون","لأنها تُسرّع الإنترنت دائماً","لا فائدة منها"],1,"التحديثات تحتوي غالباً على إصلاحات أمنية، وتأجيلها يترك جهازك معرّضاً لهجمات معروفة."],
["أنت في مقهى وتستعمل شبكة Wi-Fi عمومية مجانية. ما الذي يجب تجنّبه؟",["قراءة الأخبار","مشاهدة فيديو تعليمي","الدخول إلى حسابات حسّاسة أو إدخال معلومات بنكية","البحث عن معلومة لدرس"],2,"الشبكات العمومية قد تكون غير مؤمّنة، ويمكن لغيرك التجسّس على البيانات المرسلة عبرها."],
["ما هي «البصمة الرقمية»؟",["بصمة الإصبع لفتح الهاتف","كل الآثار التي نتركها على الإنترنت من منشورات وصور وتعليقات","برنامج لمكافحة الفيروسات","رقم سرّي للحاسوب"],1,"ما ننشره على الإنترنت قد يبقى لسنوات ويراه آخرون، لذا فكّر قبل أن تنشر."],
["تطبيق ألعاب بسيط يطلب الوصول إلى الكاميرا والميكروفون وجهات الاتصال. ماذا تفعل؟",["أقبل كل الأذونات دون قراءة","أرفض الأذونات غير الضرورية، وأستشير وليّي قبل التثبيت","أعطيه كلمة عبور هاتفي","أثبّته على هواتف كل العائلة"],1,"لا تحتاج لعبة بسيطة عادةً إلى جهات اتصالك أو الميكروفون. الأذونات الزائدة تعرّض خصوصيتك وخصوصية أسرتك للخطر."]
];

const app=document.getElementById('app');
let i=0,score=0;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function show(){
  const [p,o]=Q[i];
  app.innerHTML=`<div class="top"><span>السؤال ${i+1} من ${Q.length}</span><span>النقاط: ${score}</span></div>
  <div class="bar"><i style="width:${i/Q.length*100}%"></i></div>
  <h2>${esc(p)}</h2><div class="opts">${o.map((t,k)=>`<button class="opt" id="o${k}" data-k="${k}">${esc(t)}</button>`).join('')}</div><div id="after"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}

function pick(k){
  const [,,c,e]=Q[i];const ok=k===c;if(ok)score++;
  app.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===c)b.classList.add('right');else if(j===k)b.classList.add('wrong')});
  const last=i===Q.length-1;
  document.getElementById('after').innerHTML=`<div class="fb ${ok?'ok':'no'}"><b>${ok?'إجابة صحيحة!':'إجابة خاطئة'}</b>${esc(e)}</div>
  <div class="actions"><button class="btn" id="next">${last?'عرض النتيجة':'السؤال التالي'}</button></div>`;
  const n=document.getElementById('next');n.focus();n.onclick=()=>{i++;i<Q.length?show():end()};
}

function end(){
  const msg=score>=9?'ممتاز! أنت سفير للأمان الرقمي.':score>=6?'نتيجة جيدة، واصل الانتباه.':'راجع النصائح وحاول مرّة أخرى.';
  app.innerHTML=`<div class="bar"><i style="width:100%"></i></div><h2>نتيجتك</h2>
  <div class="score">${score} / ${Q.length}</div><p>${msg}</p>
  <ul class="tips"><li>لا تشارك كلمة عبورك مع أيّ أحد.</li><li>فكّر قبل أن تنشر أو تضغط على رابط.</li><li>إن أزعجك شيء على الإنترنت، تحدّث مع شخص بالغ تثق به.</li></ul>

  <div class="thanks">شكراً لكم على حضوركم ومشاركتكم! 🎉</div>
  <p>يسعدنا أن نمنحكم شارة تذكارية في الأمان السيبراني. اكتبوا اسمكم ولقبكم لتظهر عليها:</p>
  <div class="form">
    <label>الاسم<input id="fn" type="text" maxlength="30" autocomplete="off" placeholder="مثال: أحمد"></label>
    <label>اللقب<input id="ln" type="text" maxlength="30" autocomplete="off" placeholder="مثال: بن علي"></label>
    <div class="err" id="err" role="alert"></div>
    <div class="actions" style="margin-top:0"><button class="btn" id="mk">🏅 احصل على شارتي</button></div>
  </div>
  <div class="note">🔒 لا يتم حفظ الأسماء ولا الشارات. كل شيء يظهر على جهازك فقط ويختفي بمجرد إغلاق الصفحة.</div>
  <div id="badge"></div>
  <div class="actions"><button class="btn alt" id="again">إعادة المسابقة</button></div>`;
  document.getElementById('again').onclick=()=>{i=0;score=0;show()};
  document.getElementById('mk').onclick=makeBadge;
  document.getElementById('ln').addEventListener('keydown',e=>{if(e.key==='Enter')makeBadge()});
}

/* ---------- Badge (drawn on a canvas, never uploaded or stored) ---------- */
function tier(){
  if(score>=9) return {title:'حارس الأمان السيبراني',sub:'CYBER GUARDIAN',c1:'#f5b301',c2:'#ff8a00'};
  if(score>=6) return {title:'درع الأمان الرقمي',sub:'DIGITAL DEFENDER',c1:'#5fd3ff',c2:'#1d78ff'};
  return {title:'متدرّب الأمن السيبراني',sub:'CYBER CADET',c1:'#7ee787',c2:'#1faa59'};
}

async function makeBadge(){
  const fn=document.getElementById('fn').value.trim();
  const ln=document.getElementById('ln').value.trim();
  const err=document.getElementById('err');
  if(!fn||!ln){err.textContent='الرجاء كتابة الاسم واللقب.';return}
  err.textContent='';
  try{await Promise.all([document.fonts.load('700 40px "Reem Kufi"'),document.fonts.load('500 24px "IBM Plex Sans Arabic"')])}catch(e){}

  const W=600,H=780,t=tier();
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const x=cv.getContext('2d');
  const D='"Reem Kufi","IBM Plex Sans Arabic",Tahoma,sans-serif';
  const B='"IBM Plex Sans Arabic",Tahoma,sans-serif';
  x.direction='rtl';x.textAlign='center';x.textBaseline='middle';

  // card background
  const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1a3a');bg.addColorStop(1,'#1d2f6b');
  rr(x,0,0,W,H,36);x.fillStyle=bg;x.fill();
  // subtle circuit dots
  x.fillStyle='rgba(255,255,255,.06)';
  for(let r=0;r<14;r++)for(let c=0;c<11;c++){x.beginPath();x.arc(30+c*54,30+r*56,2.2,0,6.3);x.fill()}
  // border
  rr(x,12,12,W-24,H-24,28);x.lineWidth=4;x.strokeStyle=t.c1;x.stroke();

  // header
  x.fillStyle='#fff';x.font=`700 30px ${D}`;x.fillText('شارة الأمان السيبراني',W/2,62);
  x.fillStyle='rgba(255,255,255,.7)';x.font=`500 17px ${B}`;x.fillText('',W/2,98);

  // shield
  const cx=W/2,top=135;
  x.beginPath();
  x.moveTo(cx,top);x.bezierCurveTo(cx+60,top+30,cx+110,top+30,cx+135,top+22);
  x.lineTo(cx+135,top+150);x.bezierCurveTo(cx+135,top+230,cx+70,top+270,cx,top+300);
  x.bezierCurveTo(cx-70,top+270,cx-135,top+230,cx-135,top+150);
  x.lineTo(cx-135,top+22);x.bezierCurveTo(cx-110,top+30,cx-60,top+30,cx,top);x.closePath();
  const sg=x.createLinearGradient(cx-135,top,cx+135,top+300);sg.addColorStop(0,t.c1);sg.addColorStop(1,t.c2);
  x.shadowColor='rgba(0,0,0,.4)';x.shadowBlur=24;x.shadowOffsetY=8;x.fillStyle=sg;x.fill();
  x.shadowColor='transparent';x.lineWidth=6;x.strokeStyle='#fff';x.stroke();
  // inner shield highlight
  x.save();x.globalAlpha=.18;x.fillStyle='#fff';x.beginPath();x.moveTo(cx-120,top+30);x.lineTo(cx,top+14);x.lineTo(cx,top+270);x.bezierCurveTo(cx-70,top+235,cx-120,top+210,cx-120,top+150);x.closePath();x.fill();x.restore();

  // padlock
  const ly=top+150;
  x.strokeStyle='#0b1a3a';x.lineWidth=13;x.lineCap='round';
  x.beginPath();x.arc(cx,ly-26,32,Math.PI,0);x.lineTo(cx+32,ly-6);x.moveTo(cx-32,ly-26);x.lineTo(cx-32,ly-6);x.stroke();
  rr(x,cx-52,ly-10,104,76,14);x.fillStyle='#0b1a3a';x.fill();
  x.fillStyle=t.c1;x.beginPath();x.arc(cx,ly+22,11,0,6.3);x.fill();
  x.fillRect(cx-4.5,ly+26,9,22);

  // stars
  x.fillStyle='#fff';x.font=`28px ${B}`;
  x.fillText('★  ★  ★',cx,top+335);

  // title
  x.fillStyle=t.c1;x.font=`700 40px ${D}`;x.fillText(t.title,W/2,512);
  x.fillStyle='rgba(255,255,255,.75)';x.font=`600 18px ${B}`;x.direction='ltr';x.fillText(t.sub,W/2,548);x.direction='rtl';

  // name plate
  rr(x,50,580,W-100,96,22);x.fillStyle='rgba(255,255,255,.1)';x.fill();x.lineWidth=2;x.strokeStyle='rgba(255,255,255,.35)';x.stroke();
  x.fillStyle='rgba(255,255,255,.7)';x.font=`500 16px ${B}`;x.fillText('مُنحت إلى',W/2,602);
  const full=fn+' '+ln;
  let fs=40;x.font=`700 ${fs}px ${D}`;
  while(x.measureText(full).width>W-140&&fs>18){fs-=2;x.font=`700 ${fs}px ${D}`}
  x.fillStyle='#fff';x.fillText(full,W/2,646);

  // score + footer
  x.fillStyle='#fff';x.font=`600 20px ${B}`;x.fillText(`النتيجة: ${score} / ${Q.length}`,W/2,714);
  x.fillStyle='rgba(255,255,255,.6)';x.font=`500 14px ${B}`;x.fillText('الحملة الوطنية التحسيسية لحماية الأسرة والطفل في الفضاء السيبراني 2027',W/2,748);

  const box=document.getElementById('badge');
  box.innerHTML=`<div class="badge-wrap"><p class="thanks" style="font-size:1.3rem;margin-top:8px">مبروك! هذه شارتكم 🏅</p></div>`;
  const wrap=box.firstElementChild;cv.setAttribute('role','img');cv.setAttribute('aria-label','شارة الأمان السيبراني');
  wrap.appendChild(cv);
  const a=document.createElement('div');a.className='actions';a.style.justifyContent='center';
  a.innerHTML='<button class="btn" id="dl">⬇️ حفظ الشارة كصورة</button>';
  wrap.appendChild(a);
  a.firstChild.onclick=()=>{const l=document.createElement('a');l.download='cyber-badge.png';l.href=cv.toDataURL('image/png');l.click()};
  cv.scrollIntoView({behavior:'smooth',block:'center'});
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

show();
</script>
</body>
</html>
